name: Infrastructure Keep-Alive

# This makes one small request to Supabase and Upstash every day so both free services stay active
# even when nobody is using the app. It fails (and GitHub emails you) if a service or secret is wrong.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Query the production database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through the Supabase API
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            "${SUPABASE_URL}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Ping Upstash Redis
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 \
            "${UPSTASH_REDIS_REST_URL}/ping" \
            -H "Authorization: Bearer ${UPSTASH_REDIS_REST_TOKEN}"
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
