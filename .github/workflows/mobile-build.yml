name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.platform }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with EAS
        working-directory: apps/mobile
        run: pnpm exec eas build --profile "$EAS_BUILD_PROFILE" --platform "$EAS_BUILD_PLATFORM" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_PROFILE: ${{ inputs.profile }}
          EAS_BUILD_PLATFORM: ${{ inputs.platform }}
